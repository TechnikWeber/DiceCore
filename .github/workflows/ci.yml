# Runs ruff and the test suite (rendered dice, no camera) on every push and pull request.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -e '.[vision,server,dev]'
      - run: ruff check src tests
      - run: pytest -q
